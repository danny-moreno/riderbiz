name: riderbiz-route-validation

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend@sha256:b0045097b8b4ad5e72dce6b900326cd6ee0e98c729709214e674d0472b463f49
    platform: linux/arm64
    command:
      - osrm-routed
      - --verbosity
      - WARNING
      - --algorithm
      - mld
      - --max-table-size
      - "250"
      - /data/navarra-latest.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: "no"
    logging:
      driver: "none"

  vroom:
    image: riderbiz-vroom-validation:no-access-log
    build:
      context: ./vroom
    platform: linux/arm64
    depends_on:
      - osrm
    environment:
      VROOM_ROUTER: osrm
    tmpfs:
      - /tmp/riderbiz-requests:size=16m,mode=1777
    volumes:
      - ./vroom:/conf
    ports:
      - "127.0.0.1:3000:3000"
    restart: "no"
    logging:
      driver: "none"
